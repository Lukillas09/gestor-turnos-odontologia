<script>
    (function () {
        const turnoForm = document.querySelector("[data-horarios-form]");

        if (!turnoForm) {
            return;
        }

        const horariosUrl = turnoForm.dataset.horariosUrl;
        const searchForm = document.querySelector("[data-horarios-search]");
        const horaControl = turnoForm.elements.namedItem("hora_inicio");

        if (!horariosUrl || !horaControl || horaControl.tagName !== "SELECT") {
            return;
        }

        const odontologoControl = turnoForm.elements.namedItem("odontologo");
        const fechaControl = turnoForm.elements.namedItem("fecha");
        const duracionControl = turnoForm.elements.namedItem("duracion_minutos");
        const tipoTurnoControl = turnoForm.elements.namedItem("tipo_turno");
        const status = obtenerEstadoHorarios();
        const moreSlots = obtenerMasHorarios();
        let ultimoAbortController = null;
        let sincronizando = false;

        function obtenerEstadoHorarios() {
            let elemento = turnoForm.querySelector("[data-horarios-status]");

            if (elemento) {
                return elemento;
            }

            elemento = document.createElement("p");
            elemento.className = "muted";
            elemento.dataset.horariosStatus = "true";
            horaControl.insertAdjacentElement("afterend", elemento);
            return elemento;
        }

        function obtenerMasHorarios() {
            let elemento = turnoForm.querySelector("[data-horarios-alternativos]");

            if (elemento) {
                return elemento;
            }

            elemento = document.createElement("details");
            elemento.className = "public-more-slots";
            elemento.dataset.horariosAlternativos = "true";
            elemento.hidden = true;
            elemento.innerHTML = '<summary aria-expanded="false">Ver más horarios</summary><div class="public-time-grid" data-horarios-alternativos-lista></div>';
            status.insertAdjacentElement("afterend", elemento);
            elemento.addEventListener("toggle", function () {
                elemento.querySelector("summary").setAttribute(
                    "aria-expanded",
                    elemento.open ? "true" : "false"
                );
            });
            return elemento;
        }

        function mostrarAlternativos(opciones) {
            const lista = moreSlots.querySelector("[data-horarios-alternativos-lista]");
            lista.replaceChildren();
            moreSlots.hidden = !opciones || opciones.length === 0;

            (opciones || []).forEach((horario) => {
                const boton = document.createElement("button");
                boton.type = "button";
                boton.className = "public-slot-button";
                boton.textContent = horario.label;
                boton.addEventListener("click", function () {
                    horaControl.value = horario.value;
                    horaControl.focus();
                });
                lista.append(boton);
            });
        }

        function obtenerCampo(formulario, nombre) {
            if (!formulario) {
                return null;
            }

            return formulario.elements.namedItem(nombre);
        }

        function obtenerOdontologoId() {
            if (odontologoControl) {
                return odontologoControl.value;
            }

            return turnoForm.dataset.odontologoId || "";
        }

        function obtenerFecha() {
            return fechaControl ? fechaControl.value : "";
        }

        function obtenerDuracion() {
            return duracionControl ? duracionControl.value : "";
        }

        function setOpciones(opciones, placeholder, valorSeleccionado) {
            horaControl.replaceChildren();
            horaControl.append(new Option(placeholder, ""));

            opciones.forEach((horario) => {
                horaControl.append(new Option(horario.label, horario.value));
            });

            if (valorSeleccionado && opciones.some((horario) => horario.value === valorSeleccionado)) {
                horaControl.value = valorSeleccionado;
            }
        }

        function marcarSinDatos(mensaje) {
            setOpciones([], "Elegir odontólogo y fecha", "");
            mostrarAlternativos([]);
            status.textContent = mensaje;
        }

        function copiarBusquedaAlFormulario() {
            if (!searchForm || sincronizando) {
                return;
            }

            sincronizando = true;

            const odontologoBusqueda = obtenerCampo(searchForm, "odontologo");
            const fechaBusqueda = obtenerCampo(searchForm, "fecha");

            if (odontologoBusqueda && odontologoControl) {
                odontologoControl.value = odontologoBusqueda.value;
            }

            if (fechaBusqueda && fechaControl) {
                fechaControl.value = fechaBusqueda.value;
            }

            sincronizando = false;
        }

        function copiarFormularioABusqueda() {
            if (!searchForm || sincronizando) {
                return;
            }

            sincronizando = true;

            const odontologoBusqueda = obtenerCampo(searchForm, "odontologo");
            const fechaBusqueda = obtenerCampo(searchForm, "fecha");

            if (odontologoBusqueda && odontologoControl) {
                odontologoBusqueda.value = odontologoControl.value;
            }

            if (fechaBusqueda && fechaControl) {
                fechaBusqueda.value = fechaControl.value;
            }

            sincronizando = false;
        }

        async function actualizarHorarios() {
            const odontologoId = obtenerOdontologoId();
            const fecha = obtenerFecha();
            const valorActual = horaControl.value;

            if (!odontologoId || !fecha) {
                marcarSinDatos("Elegí odontólogo y fecha para ver horarios disponibles.");
                return;
            }

            const parametros = new URLSearchParams({
                odontologo: odontologoId,
                fecha: fecha,
                duracion_minutos: obtenerDuracion(),
            });

            if (tipoTurnoControl && tipoTurnoControl.value) {
                parametros.set("tipo_turno", tipoTurnoControl.value);
            }

            if (turnoForm.dataset.turnoId) {
                parametros.set("turno_id", turnoForm.dataset.turnoId);
            }

            if (ultimoAbortController) {
                ultimoAbortController.abort();
            }

            ultimoAbortController = new AbortController();
            horaControl.disabled = true;
            setOpciones([], "Buscando horarios...", "");
            status.textContent = "Buscando horarios disponibles...";

            try {
                const respuesta = await fetch(`${horariosUrl}?${parametros}`, {
                    headers: {"Accept": "application/json"},
                    signal: ultimoAbortController.signal,
                });
                const datos = await respuesta.json();

                if (duracionControl && datos.duracion_sugerida) {
                    duracionControl.value = datos.duracion_sugerida;
                }

                if (!datos.horarios || datos.horarios.length === 0) {
                    setOpciones([], "Sin horarios disponibles", "");
                    mostrarAlternativos([]);
                    status.textContent = datos.mensaje || "No hay horarios libres para esa fecha.";
                    return;
                }

                setOpciones(datos.horarios, "Seleccionar horario", valorActual);
                mostrarAlternativos(datos.horarios_alternativos || []);
                status.textContent = datos.mensaje || "Solo se muestran horarios libres.";
            } catch (error) {
                if (error.name === "AbortError") {
                    return;
                }

                setOpciones([], "No se pudieron cargar horarios", "");
                mostrarAlternativos([]);
                status.textContent = "No se pudieron cargar los horarios. Probá nuevamente.";
            } finally {
                horaControl.disabled = false;
            }
        }

        if (searchForm) {
            ["odontologo", "fecha"].forEach((nombre) => {
                const campo = obtenerCampo(searchForm, nombre);

                if (campo) {
                    campo.addEventListener("change", function () {
                        copiarBusquedaAlFormulario();
                        actualizarHorarios();
                    });
                }
            });

            copiarBusquedaAlFormulario();
        }

        [odontologoControl, tipoTurnoControl, fechaControl, duracionControl].forEach((campo) => {
            if (campo) {
                campo.addEventListener("change", function () {
                    copiarFormularioABusqueda();
                    actualizarHorarios();
                });
            }
        });

        actualizarHorarios();
    }());
</script>
