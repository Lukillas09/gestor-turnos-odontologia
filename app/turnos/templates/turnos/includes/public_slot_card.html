{% if horarios or horarios_extra %}
    <section class="public-slot-group{% if grupo == 'recomendados' %} is-recommended{% endif %}" data-public-slot-card data-slot-group="{{ grupo }}">
        <h3>{{ titulo }}</h3>
        <div class="public-time-grid">
            {% for opcion in horarios %}
                <a class="public-slot-button" href="{{ opcion.url }}" data-public-slot="{{ opcion.label }}" aria-label="Seleccionar horario {{ opcion.label }}">{{ opcion.label }}</a>
            {% endfor %}
            {% for opcion in horarios_extra %}
                <a class="public-slot-button" href="{{ opcion.url }}" data-public-slot="{{ opcion.label }}" aria-label="Seleccionar horario {{ opcion.label }}">{{ opcion.label }}</a>
            {% endfor %}
        </div>
    </section>
{% endif %}
