name: CI Django

# Los pushes a ramas de trabajo se validan por su pull request; push solo dispara en main.
# Para una rama sin PR se puede lanzar a mano con workflow_dispatch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# En un PR, una corrida nueva cancela la anterior del mismo PR; ramas distintas no se cruzan.
# En main cada corrida usa su run_id como grupo: con un grupo compartido, una corrida pendiente
# se cancela al encolarse otra aunque cancel-in-progress sea false, y cada commit integrado
# tiene que completar sus checks.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  DJANGO_SECRET_KEY: "ci-only-secret-key-not-for-production"
  DJANGO_DEBUG: "True"
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
  DJANGO_CSRF_TRUSTED_ORIGINS: ""
  DJANGO_SECURE_SSL_REDIRECT: "False"
  DJANGO_SESSION_COOKIE_SECURE: "False"
  DJANGO_CSRF_COOKIE_SECURE: "False"
  DJANGO_SECURE_HSTS_SECONDS: "0"
  DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "False"
  DJANGO_SECURE_HSTS_PRELOAD: "False"
  DJANGO_SECURE_PROXY_SSL_HEADER: "False"
  DJANGO_LOG_LEVEL: "INFO"
  DATABASE_URL: ""
  EMAIL_BACKEND: "django.core.mail.backends.locmem.EmailBackend"
  DEFAULT_FROM_EMAIL: "ci@example.test"
  EMAIL_API_PROVIDER: "resend"
  EMAIL_API_KEY: ""
  EMAIL_API_URL: ""
  MEDIA_STORAGE_BACKEND: "django.core.files.storage.FileSystemStorage"
  SUPABASE_STORAGE_URL: ""
  SUPABASE_STORAGE_BUCKET: "historias-clinicas"
  SUPABASE_STORAGE_SERVICE_ROLE_KEY: ""
  REDIS_URL: ""
  TURNOS_PUBLIC_REDIS_REQUIRED: "False"
  TURNOS_PUBLIC_BOOKING_IP_LIMIT: "10"
  TURNOS_PUBLIC_BOOKING_IP_WINDOW_SECONDS: "900"
  TURNOS_PUBLIC_BOOKING_DNI_LIMIT: "5"
  TURNOS_PUBLIC_BOOKING_DNI_WINDOW_SECONDS: "3600"
  TURNOS_PUBLIC_BOOKING_TURNSTILE_AFTER_ATTEMPTS: "3"
  TURNOS_PUBLIC_BOOKING_MAX_PENDING_PER_DNI: "2"
  TURNOS_PUBLIC_BOOKING_IDEMPOTENCY_SECONDS: "3600"
  TURNOS_PUBLIC_BOOKING_PROCESSING_SECONDS: "120"
  TURNOS_PUBLIC_BOOKING_DUPLICATE_WINDOW_SECONDS: "86400"
  TURNOS_PUBLIC_BOOKING_HORARIOS_CACHE_SECONDS: "0"
  TURNSTILE_ENABLED: "False"
  TURNSTILE_SITE_KEY: ""
  TURNSTILE_SECRET_KEY: ""
  GOOGLE_CALENDAR_CLIENT_ID: ""
  GOOGLE_CALENDAR_CLIENT_SECRET: ""
  GOOGLE_CALENDAR_CLIENT_SECRET_FILE: ""
  GOOGLE_CALENDAR_CLIENT_SECRETS_FILE: ""
  GOOGLE_CALENDAR_REDIRECT_URI: "http://localhost/turnos/google-calendar/callback/"
  GOOGLE_CALENDAR_SCOPES: "https://www.googleapis.com/auth/calendar.events"
  OAUTH_TOKEN_ENCRYPTION_KEY: ""
  ODONTOGRAMA_FEATURE_ENABLED: "False"
  TURNOS_PUBLIC_SMART_SCHEDULING_ENABLED: "False"
  DATOS_CLINICOS_COMPARTIDOS_ENTRE_ODONTOLOGOS: "False"
  ACCESO_CLINICO_EMERGENCIA_SECONDS: "900"
  CLINICAL_INTEGRITY_ENABLED: "True"
  CLINICAL_INTEGRITY_HMAC_KEY: "ci-only-clinical-integrity-key-not-for-production"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependencias de desarrollo
        run: python -m pip install -r requirements-dev.txt

      - name: Validar codificacion de textos
        if: ${{ hashFiles('scripts/check_text_encoding.py') != '' }}
        run: python scripts/check_text_encoding.py

      - name: Verificar formato con Black
        run: python -m black --check app scripts --exclude migrations

      - name: Ejecutar Ruff
        run: python -m ruff check app scripts

      - name: Ejecutar Mypy incremental
        run: >
          python -m mypy
          app/config
          app/consultorio
          app/turnos/public_access
          app/turnos/solicitudes_publicas
          app/turnos/forms
          app/turnos/views

  django-tests:
    name: Django checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Verificar dependencias
        run: python -m pip check

      - name: Validar configuracion de Django
        working-directory: app
        run: python manage.py check

      - name: Comprobar migraciones
        working-directory: app
        run: python manage.py makemigrations --check --dry-run

      - name: Generar archivos estaticos
        working-directory: app
        run: python manage.py collectstatic --noinput

      - name: Ejecutar tests con cobertura
        working-directory: app
        run: >
          python -m coverage run --rcfile=../pyproject.toml manage.py test
          config
          consultorio
          historias
          indicaciones.tests
          odontogramas
          pacientes
          usuarios
          turnos.tests
          turnos.tests_email_api
          turnos.tests_google_calendar
          turnos.tests_internal_availability_permissions
          turnos.tests_patient_visible_end
          turnos.tests_post_commit_integrations
          turnos.tests_public_protection
          turnos.tests_smart_scheduling
          turnos.tests_concurrency
          --verbosity 2

      - name: Reportar cobertura
        working-directory: app
        run: python -m coverage report --rcfile=../pyproject.toml -m

      - name: Exportar cobertura XML
        working-directory: app
        run: python -m coverage xml --rcfile=../pyproject.toml

      - name: Subir cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: app/coverage.xml

  clinical-postgresql:
    name: PostgreSQL guarantees
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/clinical_ci

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: clinical_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clinical_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Aplicar migraciones PostgreSQL
        working-directory: app
        run: python manage.py migrate --noinput

      - name: Generar archivos estaticos
        working-directory: app
        run: python manage.py collectstatic --noinput

      - name: Ejecutar tests clinicos sobre PostgreSQL
        working-directory: app
        run: >
          python manage.py test
          historias
          indicaciones.tests
          turnos.tests_concurrency.AgendaConcurrentePostgreSQLTests
          turnos.tests_public_protection.ProteccionesPublicasPostgreSQLTests
          turnos.tests_smart_scheduling.AgendaInteligentePostgreSQLTests
          --verbosity 2

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependencias de seguridad
        run: python -m pip install -r requirements-dev.txt

      - name: Ejecutar Bandit
        run: >
          python -m bandit -c pyproject.toml -r app
          -x "*/migrations/*,*/tests.py,*/tests_*.py,*/tests_e2e/*"
          -ll

      - name: Auditar dependencias de produccion
        run: python -m pip_audit -r requirements.txt

  e2e:
    name: E2E browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: django-tests
    env:
      CHROMIUM_LAUNCH_CHECK: >-
        from playwright.sync_api import sync_playwright;
        p = sync_playwright().start(); p.chromium.launch().close(); p.stop()

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Actualizar pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependencias de desarrollo
        run: python -m pip install -r requirements-dev.txt

      # La clave incluye la imagen del runner (ImageOS, por ejemplo ubuntu24) y la arquitectura:
      # ubuntu-latest cambia de version y un Chromium cacheado en otra imagen no se reutiliza.
      - name: Obtener version de Playwright e imagen del runner
        id: playwright-version
        run: |
          echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cachear Chromium de Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright-version.outputs.image }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}

      - name: Instalar Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      # Con cache el navegador ya esta y las librerias del sistema suelen venir en la imagen del
      # runner: se prueba que Chromium arranque sin usar apt.
      - name: Verificar Chromium en cache
        id: chromium-check
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        continue-on-error: true
        run: python -c "$CHROMIUM_LAUNCH_CHECK"

      # Si no arranca, se reinstala con dependencias del sistema (cubre tambien una cache
      # incompleta) y se vuelve a comprobar sin continue-on-error para no ocultar el fallo.
      - name: Instalar dependencias del sistema de Chromium
        if: steps.chromium-check.outcome == 'failure'
        run: python -m playwright install --with-deps chromium

      - name: Verificar Chromium tras la recuperacion
        if: steps.chromium-check.outcome == 'failure'
        run: python -c "$CHROMIUM_LAUNCH_CHECK"

      - name: Generar archivos estaticos
        working-directory: app
        run: python manage.py collectstatic --noinput

      - name: Ejecutar E2E
        working-directory: app
        run: python manage.py test turnos.tests_e2e indicaciones.tests_e2e --verbosity 2
